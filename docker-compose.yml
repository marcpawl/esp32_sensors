# ESP32 Solar-Powered Thermometer Logger — development environment.
#
# Usage:
#   docker compose pull                         # fetch the prebuilt dev image
#   docker compose run --rm dev                 # interactive shell
#   docker compose run --rm dev idf.py build    # run a single command
#
# --- Which image? ---------------------------------------------------------
# `dev` normally PULLS the prebuilt dev image `marcpawl/esp-idf:20261025`
# (ESP-IDF v6.1 + our project tooling), so neither developers nor CI need to
# rebuild it: the same stable image is used everywhere, and CI only has to
# `docker pull` it. The tag is date-stamped and never moved; bump it only when
# the `Dockerfile` changes and a new image has been pushed under a new tag.
#
# The `build:` section is kept so the image can still be (re)built from the
# committed `Dockerfile` when needed:
#   - build and also tag it as the pinned image:
#       docker compose build
#   - build under a throw-away tag, leaving the pinned image untouched:
#       docker build -t esp32-sensors-dev:local .
# Note: the image's non-root user is UID 1000/GID 1000 and owns /home/dev and
# the ESP-IDF tree. The container runs as the *host* user (`--user
# "$(id -u):$(id -g)"`), so build artifacts keep the host ownership; when
# dev.py itself runs as root it uses the image user 1000:1000 instead. On a
# host whose UID differs from 1000 (e.g. CI runners use 1001) the container
# user has no passwd entry in the image, so HOME falls back to a directory it
# cannot use and ccache fails with "Permission denied". `scripts/dev.py`
# therefore pins HOME, CCACHE_DIR, and a git `safe.directory` for the
# root-owned IDF tree for whatever user the container runs as.
#
# --- CLion / Dev Containers ----------------------------------------------
# The `dev` service below is also the target of `.devcontainer/devcontainer.json`,
# so CLion ("From VCS" / "Open Dev Container") builds and starts this exact
# container and runs the toolchain inside it. Keep both in sync: change the
# image, mounts, or user here, not in the devcontainer file.
#
# --- Flashing / monitoring the ESP32 -------------------------------------
# The host `/dev` tree is bind-mounted into the container, so any USB serial
# device that appears on the host (e.g. /dev/ttyUSB0, /dev/ttyACM0) is visible
# inside the container. Serial access is granted by joining the host `dialout`
# GID via `group_add`, so the container does NOT need --privileged.
#
# Because `/dev` is bind-mounted, no device needs to be hard-coded in this
# file — which also means `docker compose run` works fine when no board is
# attached (useful for `idf.py build` and host tests).
#
# If the ESP32 board is connected after the container starts it will
# be visisble in the container.

services:
  dev:
    # Prebuilt, pinned dev image (see the header). Pulled with
    # `docker compose pull`; `docker compose run` uses the local copy if the
    # pull has not been done yet, and builds it from the Dockerfile if neither
    # exists.
    image: marcpawl/esp-idf:20261025

    # Kept so the image can be rebuilt from the committed Dockerfile (and be
    # tagged as `image:` above). Building is NOT part of the normal workflow.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # User baked into the image. Keep at 1000: the image's non-root user
        # owns /home/dev and the ESP-IDF tree, and dev.py runs the container
        # as that user when dev.py itself runs as root (see the note above).
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        DIALOUT_GID: "${DIALOUT_GID:-20}"

    # Interactive TTY so `idf.py monitor` and its menus work correctly.
    stdin_open: true
    tty: true
    init: true

    # Join the host `dialout` GID so serial devices in the bind-mounted /dev
    # are readable/writable without --privileged.
    group_add:
      - "${DIALOUT_GID:-20}"

    device_cgroup_rules:
      - 'c *:* rmw' # Essential: Allows container to read/write/make new char devices
        
    volumes:
      # Project source is bind-mounted so edits on the host are visible live.
      - .:/project
      # Expose host USB/serial device nodes (ttyUSB*, ttyACM*, etc.).
      - /dev:/dev
      # NOTE: do NOT bind-mount /tmp (e.g. ./tmp:/tmp). It replaces the
      # image's /tmp (mode 1777) with a root-owned host directory, so the
      # non-root container user cannot create scratch files there. That breaks
      # CLion/Gateway deploys, which fail with
      # "open /tmp/cwmHostStatus<N>: permission denied".
      # Persist shell history and the IDF component cache between runs.
      - idf-bash-history:/home/dev/.commandhistory
      - idf-espressif-cache:/home/dev/.espressif

    working_dir: /project
    environment:
      HISTFILE: /home/dev/.commandhistory/.bash_history
      # Pass through the host's ESP32_PORT (serial device) only when it is
      # actually set on the host, so the variable is absent (not empty) in
      # the container otherwise. A null value means "take from the host env".
      ESP32_PORT:

    # Optional: expose the device's HTTPS config server for host-side testing
    # once Configure mode is implemented (adjust the container-side port).
    # ports:
    #   - "443:443"

    # Run an interactive login shell by default.
    command: ["/bin/bash", "-l"]

    # No entrypoint override, deliberately. The image runs
    # /opt/esp/entrypoint.sh, which sources the ESP-IDF environment and then
    # `exec "$@"`. `docker compose run dev <args>` *replaces* the CMD above
    # with <args>, and any further words in a target compose file's `command:`
    # are appended to them. `scripts/dev.py` therefore always passes exactly
    # `sh -c <script>` and never `--entrypoint`: without `sh` the entrypoint
    # would run `/bin/sh -c <script>`, and `/bin/sh` here is dash, which does
    # not accept arguments after `.` — so `. <export>; <cmd>` was sourced as
    # a single (nonexistent) file name and failed with exit 127.

volumes:
  idf-bash-history:
  idf-espressif-cache:
