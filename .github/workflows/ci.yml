name: CI

on:
  push:
    branches: [ "v0.1" ]
  pull_request:
    branches: [ "v0.1" ]

# The dev image is PREBUILT and pinned in docker-compose.yml
# (`image: marcpawl/esp-idf:20261109b`); CI pulls it instead of building it from
# the Dockerfile, so a run does not spend minutes rebuilding a toolchain image
# that never changes. Bump the tag in docker-compose.yml + scripts/dev.py
# (`DEV_IMAGE`) — and only there — when a new image is published; `dev.py
# self-check` fails if the two disagree.
jobs:
  build-and-test:
    # GitHub's runner user is uid 1001, not the image's 1000. `scripts/dev.py`
    # runs the container as the *calling* user and pins HOME/CCACHE_DIR for it,
    # so build artifacts are owned by the runner (no root-owned files) and
    # ccache does not fail with "Permission denied".
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pull dev image
        # Host-only: `docker pull` of the pinned tag. Not run inside a
        # container, and not a build.
        run: |
          python3 ./scripts/dev.py pull

      - name: Fetch git submodules
        # `third_party/sml` (boost-ext/sml, pinned to v1.2.0) is a git submodule
        # and a requirement of the `liblogic` component, so the build cannot
        # configure without it. `build` fetches it automatically too, but this
        # step makes a failed clone (network, bad pin) its own visible failure
        # rather than a confusing configure error deep in the build log.
        run: |
          python3 ./scripts/dev.py submodules

      - name: dev.py self-check
        # Host-only and no Docker: `self-check` refuses to run inside the
        # container, because there the host-only decisions it pins (does a
        # command re-exec itself under `docker compose`?) never happen and the
        # suite would pass vacuously. It runs the stdlib unit tests instead.
        run: |
          python3 ./scripts/dev.py self-check

      # Python style is the cheapest gate, so it runs first — it needs no
      # compile database and no build, and a long line is fixed in seconds
      # compared with waiting for the toolchain below.
      - name: pycodestyle
        run: |
          python3 ./scripts/dev.py pycodestyle

      - name: Run build
        run: |
          python3 ./scripts/dev.py build

      # Static analysis reads the compile databases the build just produced, so
      # it must run after `build` (it never builds anything itself).
      - name: Run clang-tidy
        run: |
          python3 ./scripts/dev.py clang-tidy

      - name: Run tests
        run: |
          python3 ./scripts/dev.py test

      - name: Run format-check
        run: |
          python3 ./scripts/dev.py format-check
