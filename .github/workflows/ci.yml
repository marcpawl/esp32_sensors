name: CI

on:
  push:
    branches: [ "v0.1" ]
  pull_request:
    branches: [ "v0.1" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # Set to true if you are pushing to a registry
          tags: my-app:latest
          # Enable caching here 👇
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build image
        run: |
          python3 ./scripts/dev.py image

      - name: Run build
        run: |
          python3 ./scripts/dev.py build

      - name: Run tests
        run: |
          python3 ./scripts/dev.py test

      - name: Run format-check
        run: |
          python3 ./scripts/dev.py format-check
