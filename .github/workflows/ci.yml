name: CI

on:
  push:
    branches: [ "v0.1" ]
  pull_request:
    branches: [ "v0.1" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run build
        run: |
          docker compose run --rm dev python3 /project/scripts/dev.py build

      - name: Run tests
        run: |
          docker compose run --rm dev python3 /project/scripts/dev.py test

      - name: Run format-check
        run: |
          docker compose run --rm dev python3 /project/scripts/dev.py format-check
