name: CI

on:
  push:
    branches: [ "v0.1" ]
  pull_request:
    branches: [ "v0.1" ]
    # `ready_for_review` re-runs the checks when a draft PR is marked ready;
    # without it the only run would be the one skipped below.
    types: [ opened, synchronize, reopened, ready_for_review ]

# The dev image is PREBUILT and pinned in docker-compose.yml
# (`image: marcpawl/esp-idf:20261119c`); CI pulls it instead of building it from
# the Dockerfile, so a run does not spend minutes rebuilding a toolchain image
# that never changes. Bump the tag in docker-compose.yml + scripts/dev.py
# (`DEV_IMAGE`) — and only there — when a new image is published; `dev.py
# self-check` fails if the two disagree.
jobs:
  build-and-test:
    # Draft pull requests are work in progress: no checks until they are marked
    # ready for review, which saves the expensive build/test run. `push` builds
    # have no `pull_request` payload, so the first condition keeps them running.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false

    # GitHub's runner user is uid 1001, not the image's 1000. `scripts/dev.py`
    # runs the container as the *calling* user and pins HOME/CCACHE_DIR for it,
    # so build artifacts are owned by the runner (no root-owned files) and
    # ccache does not fail with "Permission denied".
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect doc-only changes
        id: changes
        shell: bash
        # Markdown files are not part of the build or the quality checks, so a
        # change that touches only *.md files skips every expensive step below,
        # including the dev-image pull. If the diff cannot be determined
        # (new branch, force-push with an unknown base, ...), run every check.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_md=$(printf '%s\n' "$changed" | grep -viE '\.md$' || true)
          if [ -z "$non_md" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only Markdown files changed; skipping CI checks."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull dev image
        if: steps.changes.outputs.docs_only != 'true'
        # Host-only: `docker pull` of the pinned tag. Not run inside a
        # container, and not a build.
        run: |
          python3 ./scripts/dev.py pull

      - name: Fetch git submodules
        if: steps.changes.outputs.docs_only != 'true'
        # `third_party/sml` (boost-ext/sml, pinned to v1.2.0) is a git submodule
        # and a requirement of the `liblogic` component, so the build cannot
        # configure without it. `build` fetches it automatically too, but this
        # step makes a failed clone (network, bad pin) its own visible failure
        # rather than a confusing configure error deep in the build log.
        run: |
          python3 ./scripts/dev.py submodules

      - name: dev.py self-check
        if: steps.changes.outputs.docs_only != 'true'
        # Host-only: `self-check` refuses to run inside the container, because
        # there the host-only decisions it pins (does a command re-exec itself
        # under `docker compose`?) never happen and the suite would pass
        # vacuously. It runs the stdlib unit tests instead, plus a few probes
        # of the pinned image's shells, which need the `docker pull` above.
        run: |
          python3 ./scripts/dev.py self-check

      # Python style is the cheapest gate, so it runs first — it needs no
      # compile database and no build, and a long line is fixed in seconds
      # compared with waiting for the toolchain below.
      - name: pycodestyle
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 ./scripts/dev.py pycodestyle

      # Checking C++ formatting does not need the compile database
      # and is fast to run, catching formatting errors before
      # running the expensive checks.
      - name: format-check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 ./scripts/dev.py format-check

      # GCC's analyzer and the runtime sanitizers cannot share a translation
      # unit: the analyzer reads the checks they insert as uninitialised reads.
      # This gate only analyzes: dev.py reconfigures and replays the compile
      # commands with output to /dev/null, building no objects or ELFs.
      - name: static analysis with GCC analyzer
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 ./scripts/dev.py build --analyzer

      # Static analysis reads the compile databases the reconfigure just
      # produced, so it must run after the analyzer gate (it never builds).
      - name: clang-tidy
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 ./scripts/dev.py clang-tidy /project

      # Rebuild without --analyzer immediately before the tests: that is how
      # the ELFs they run get UBSan and ASan. dev.py passes the cache variable
      # explicitly in both directions, so the switch cannot leave stale flags.
      - name: build with sanitizers
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 ./scripts/dev.py build

      - name: tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python3 ./scripts/dev.py test-linux

