name: CI

on:
  push:
    branches: [ "v0.1" ]
  pull_request:
    branches: [ "v0.1" ]

# The dev image is prebuilt and pinned in docker-compose.yml; CI pulls it
# instead of rebuilding it from the Dockerfile (see the `pull` step). Bump the
# tag there, and only there, when a new image is published.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull dev image
        # `dev.py pull` is host-only (it cannot run inside the container).
        run: |
          python3 ./scripts/dev.py pull

      - name: dev.py self-check
        # No container and no Docker: runs the host stdlib unit tests.
        run: |
          python3 ./scripts/dev.py self-check

      - name: Run build
        run: |
          python3 ./scripts/dev.py build

      - name: Run tests
        run: |
          python3 ./scripts/dev.py test

      - name: Run format-check
        run: |
          python3 ./scripts/dev.py format-check
