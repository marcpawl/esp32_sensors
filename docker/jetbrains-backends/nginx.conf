server {
    listen 8080;
    server_name localhost;

    location / {
        root /JetBrains/Desktop;

        # Enable directory listing since there are no index.html files
        autoindex on;
        autoindex_exact_size off; # Display human-readable file sizes (e.g., MB, GB)
        autoindex_localtime off;   # Display file times in local timezone

        # Ensure correct MIME types and default fallback for downloads
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
    }
}
