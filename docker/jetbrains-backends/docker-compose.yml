
services:
  # Serve JetBrains backends so CLion can open the project on an 
  # Air Gapped host.
  jetbrains-backends:
    build:
      context: .
      dockerfile: Dockerfile
    image: jetbrains-backends:latest
    container_name: jetbrains-backends
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
